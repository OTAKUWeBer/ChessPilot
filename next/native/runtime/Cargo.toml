[package]
name = "chesspilot-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
chesspilot-core = { path = "../core" }
serde_json = "=1.0.154"
log = "=0.4.35"
time = { version = "=0.3.55", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
# Keep the pre-release C bindings on the same ONNX Runtime 1.20 API as ort.
ort-sys = { version = "=2.0.0-rc.9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"
x11rb = { version = "=0.13.2", features = ["randr", "xtest"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }
