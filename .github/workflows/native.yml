name: Rust and Flutter desktop

on:
  push:
    branches: [main]
    paths: ['app/**', 'native/**', 'tool/**', 'packaging/**', 'assets/models/chess_detection.onnx*', 'assets/**', 'engine_config.txt', 'LICENSE', '.gitattributes', '.github/workflows/native.yml']
  pull_request:
    branches: [main]
    paths: ['app/**', 'native/**', 'tool/**', 'packaging/**', 'assets/models/chess_detection.onnx*', 'assets/**', 'engine_config.txt', 'LICENSE', '.gitattributes', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            bundle: windows/x64/runner/Release
            native: chesspilot_runtime.dll
            ort: onnxruntime.dll
          - os: ubuntu-22.04
            platform: linux
            bundle: linux/x64/release/bundle
            native: lib/libchesspilot_runtime.so
            ort: lib/libonnxruntime.so
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      CHESSPILOT_DATA_HOME: ${{ github.workspace }}/native/target/ci-data
      CHESSPILOT_LOG_DIR: ${{ github.workspace }}/native/target/ci-logs
      CHESSPILOT_MODEL: ${{ github.workspace }}/assets/models/chess_detection.onnx
      CHESSPILOT_ORT: ${{ github.workspace }}/app/build/${{ matrix.bundle }}/${{ matrix.ort }}
      CHESSPILOT_LIBRARY_PATH: ${{ github.workspace }}/app/build/${{ matrix.bundle }}/${{ matrix.native }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled detection model
        shell: bash
        working-directory: assets/models
        run: sha256sum --check chess_detection.onnx.sha256
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgtk-3-bin liblzma-dev libstdc++-12-dev xvfb makeself librsvg2-dev libgirepository1.0-dev libgdk-pixbuf2.0-bin file dpkg-dev binutils desktop-file-utils
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - name: Install Flutter
        shell: bash
        run: |
          flutter_version="$(sed -nE 's/^[[:space:]]*"flutter"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)"[[:space:]]*,?[[:space:]]*$/\1/p' "app/.fvmrc")"
          if [ "$RUNNER_OS" = Linux ]; then
            bash -n tool/flutter_linux.sh
            bash -n tool/build_linux.sh
            bash -n tool/build_linux_installer.sh
            bash -n tool/test_linux_installer.sh
            bash -n tool/test_linux_formats.sh
            bash -n packaging/linux/install.sh
            bash -n packaging/linux/AppRun
            bash tool/flutter_linux.sh --version
            echo "$GITHUB_WORKSPACE/native/target/flutter-sdk/$flutter_version/bin" >> "$GITHUB_PATH"
          else
            git clone --depth 1 --branch "$flutter_version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          fi
      - name: Check release version consistency
        run: dart tool/version.dart --check
      - name: Test release version tooling
        run: dart --enable-asserts tool/tests/version_test.dart
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all --check
      - name: Check Rust warnings
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Run native regression tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Check desktop window sizing
        run: |
          cmake -S tool/tests/window_size -B native/target/window-size-check
          cmake --build native/target/window-size-check --config Release
          ctest --test-dir native/target/window-size-check -C Release --output-on-failure
      - name: Prepare pinned ONNX Runtime
        run: cmake -P tool/prepare_desktop.cmake
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Check Flutter
        working-directory: app
        run: flutter analyze --no-pub
      - name: Build the complete desktop bundle
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release --no-pub
      - name: Run Flutter against the packaged runtime
        working-directory: app
        run: flutter test --no-pub
      - name: Check real ONNX inference and refined search
        run: cargo test --manifest-path native/Cargo.toml --release --locked --test vision actual_onnx_inference_and_zoom_search_match_reference -- --ignored
      - name: Probe X11 capture and input capability without a gesture
        if: runner.os == 'Linux'
        env:
          CHESSPILOT_LINUX_CAPTURE_TEST: '1'
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a cargo test --manifest-path native/Cargo.toml --release --locked --test linux_live -- --ignored --nocapture
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath ChessPilot-windows-x64.zip
      - name: Build single-file Windows installer
        if: runner.os == 'Windows'
        run: ./tool/build_windows_installer.ps1
      - name: Check isolated install, upgrade and uninstall
        if: runner.os == 'Windows'
        run: ./tool/test_windows_installer.ps1
      - name: Archive Linux bundle with executable permissions
        if: runner.os == 'Linux'
        run: tar -czf ChessPilot-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
      - name: Build Linux portable app and installer with GTK dependencies
        if: runner.os == 'Linux'
        run: bash tool/build_linux_installer.sh
      - name: Check Linux installer lifecycle and relocated runtime
        if: runner.os == 'Linux'
        run: bash tool/test_linux_installer.sh app/build/linux/installer/*-setup.run app/build/linux/installer/ChessPilot-*-linux-x86_64
      - name: Check AppImage and Debian payloads without system installation
        if: runner.os == 'Linux'
        run: bash tool/test_linux_formats.sh app/build/linux/installer/*.AppImage app/build/linux/installer/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ChessPilot-${{ matrix.platform }}-x64
          path: ChessPilot-${{ matrix.platform }}-x64.*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ChessPilot-windows-x64-installer
          path: app/build/windows/installer/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ChessPilot-linux-x64-portable
          path: |
            app/build/linux/installer/ChessPilot-*-linux-x86_64
            app/build/linux/installer/ChessPilot-*-linux-x86_64.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ChessPilot-linux-x64-packages
          path: |
            app/build/linux/installer/*.AppImage
            app/build/linux/installer/*.AppImage.sha256
            app/build/linux/installer/*.deb
            app/build/linux/installer/*.deb.sha256
            app/build/linux/installer/*-build-info.txt*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ChessPilot-linux-x64-installer
          path: |
            app/build/linux/installer/*-setup.run
            app/build/linux/installer/*-setup.run.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
