name: Rust and Flutter desktop

on:
  push:
    branches: [rust]
    paths: ['app/**', 'native/**', 'tool/**', 'packaging/**', 'assets/models/chess_detection.onnx*', 'assets/**', '.github/workflows/native.yml']
  pull_request:
    branches: [rust]
    paths: ['app/**', 'native/**', 'tool/**', 'packaging/**', 'assets/models/chess_detection.onnx*', 'assets/**', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            bundle: windows/x64/runner/Release
            native: chesspilot_runtime.dll
            ort: onnxruntime.dll
          - os: ubuntu-24.04
            platform: linux
            bundle: linux/x64/release/bundle
            native: lib/libchesspilot_runtime.so
            ort: lib/libonnxruntime.so
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
      CHESSPILOT_DATA_HOME: ${{ github.workspace }}/native/target/ci-data
      CHESSPILOT_LOG_DIR: ${{ github.workspace }}/native/target/ci-logs
      CHESSPILOT_MODEL: ${{ github.workspace }}/assets/models/chess_detection.onnx
      CHESSPILOT_ORT: ${{ github.workspace }}/app/build/${{ matrix.bundle }}/${{ matrix.ort }}
      CHESSPILOT_LIBRARY_PATH: ${{ github.workspace }}/app/build/${{ matrix.bundle }}/${{ matrix.native }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact Python model
        shell: bash
        working-directory: assets/models
        run: sha256sum --check chess_detection.onnx.sha256
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
      - name: Install Flutter
        shell: bash
        run: |
          flutter_version="$(python -c 'import json; print(json.load(open("app/.fvmrc"))["flutter"])')"
          if [ "$RUNNER_OS" = Linux ]; then
            bash -n tool/flutter_linux.sh
            bash -n tool/build_linux.sh
            bash tool/flutter_linux.sh --version
            echo "$GITHUB_WORKSPACE/native/target/flutter-sdk/$flutter_version/bin" >> "$GITHUB_PATH"
          else
            git clone --depth 1 --branch "$flutter_version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
            echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          fi
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all --check
      - name: Check Rust warnings
        run: cargo clippy --manifest-path native/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Run native regression tests
        run: cargo test --manifest-path native/Cargo.toml --workspace --locked
      - name: Prepare pinned ONNX Runtime
        run: cmake -P tool/prepare_desktop.cmake
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Check Flutter
        working-directory: app
        run: flutter analyze --no-pub
      - name: Build the complete desktop bundle
        working-directory: app
        run: flutter build ${{ matrix.platform }} --release --no-pub
      - name: Run Flutter against the packaged runtime
        working-directory: app
        run: flutter test --no-pub
      - name: Check real ONNX inference and refined search
        run: cargo test --manifest-path native/Cargo.toml --release --locked --test vision actual_onnx_inference_and_zoom_search_match_python -- --ignored
      - name: Probe X11 capture and input capability without a gesture
        if: runner.os == 'Linux'
        env:
          CHESSPILOT_LINUX_CAPTURE_TEST: '1'
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a cargo test --manifest-path native/Cargo.toml --release --locked --test linux_live -- --ignored --nocapture
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath ChessPilot-windows-x64.zip
      - name: Build single-file Windows installer
        if: runner.os == 'Windows'
        run: ./tool/build_windows_installer.ps1
      - name: Check isolated install, upgrade and uninstall
        if: runner.os == 'Windows'
        run: ./tool/test_windows_installer.ps1
      - name: Archive Linux bundle with executable permissions
        if: runner.os == 'Linux'
        run: tar -czf ChessPilot-linux-x64.tar.gz -C app/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: ChessPilot-${{ matrix.platform }}-x64
          path: ChessPilot-${{ matrix.platform }}-x64.*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ChessPilot-windows-x64-installer
          path: app/build/windows/installer/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
